name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and integration tests (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify
      - name: Run unit and integration tests (macOS and Linux)
        if: runner.os != 'Windows'
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
