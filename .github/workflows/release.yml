name: Draft release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: windows-x64
          - os: macos-15-intel
            package: macos-x64
          - os: macos-15
            package: macos-arm64
          - os: ubuntu-latest
            package: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm x11-utils
      - name: Install WiX
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command candle -ErrorAction SilentlyContinue) -or -not (Get-Command light -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress
          }
          Get-Command candle, light
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1
      - name: Build macOS and Linux packages
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.package }}
          path: target/dist/*
          if-no-files-found: error

  publish-draft:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate package checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Create draft and attach installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## UsageTime Tracker

          A local-first desktop app that tracks which application is in the foreground and how long it is used. Data stays on this device unless you explicitly export it.

          EOF
          if [ "$TAG" = "v0.1.3.1" ]; then
            cat >> release-notes.md <<'EOF'
          ### What's new in v0.1.3.1

          - Temporarily disables HotSpot's Base64 intrinsic in bundled runtimes as a Java4Shell mitigation pending fixed JDK builds.

          EOF
          elif [ "$TAG" = "v0.1.3" ]; then
            cat >> release-notes.md <<'EOF'
          ### What's new in v0.1.3

          - Redesigned the weekly heatmap with clearer time groupings, dates, and daily totals.
          - Added per-app usage details when hovering over an hour.
          - Shortened the manual pause status to "Tracking is paused."
          - Removed unnecessary space beside the status message.
          - Added a Maven wrapper so contributors can build without installing Maven separately.
          - Fixed the weekly heatmap extending beyond the available width.

          EOF
          fi
          cat >> release-notes.md <<'EOF'
          ### Features

          - Records foreground application names and usage sessions; pauses tracking after five minutes of inactivity.
          - Provides daily, week-to-date, and month-to-date reports, a timeline, category breakdowns, and a weekly heatmap.
          - Supports local categories, optional per-app daily goals, and explicit CSV or JSON exports.
          - Stores history locally in SQLite. It does not collect window titles, URLs, keystrokes, screenshots, or document names.
          - Bundles a trimmed Java runtime; a separate Java installation is not needed to run the packages.

          ### Downloads

          Choose the package for your operating system and architecture from the assets below:

          - Windows: EXE installer, MSI installer, or portable ZIP.
          - macOS: DMG for Intel or Apple Silicon.
          - Linux: DEB, RPM, or x86-64 AppImage.

          ### Notes

          - Windows and macOS packages are unsigned; Linux packages are not repository-signed. Your OS may show security warnings. Verify the SHA-256 checksums before use.
          - Linux foreground tracking currently requires X11; Wayland is not supported.
          - macOS may request Automation permission for foreground-app detection.
          - This is an MVP release; it has no self-updater.
          EOF
          if [ "$TAG" = "v0.1.3" ]; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace a release that is not a draft." >&2
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --draft
          fi
